name: PositionBar direct release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional expected source SHA; defaults to source main, required original SHA for recovery
        required: false
        default: ''
        type: string
      mode:
        description: Verify only, or explicitly publish the notarized direct distribution
        required: true
        default: verify
        type: choice
        options: [verify, release]
      resume_run_id:
        description: Earlier direct-release run ID, only for restoring its original identity and verified DMG
        required: false
        default: ''
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests -v

  verify:
    name: Verify direct-distribution source without publication
    needs: offline
    # Private source is read only for this repository's own PRs and dispatches.
    if: >-
      github.repository == 'PositionBar/homebrew-tap' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # PRs verify a reviewed source; dispatches resolve source main by default.
      PR_SOURCE_SHA: dff62195853144f89da214aa7fdc1f23690fba57
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: tap
          persist-credentials: false
      - name: Resolve application source
        id: source
        env:
          INPUT_SHA: ${{ github.event_name == 'pull_request' && env.PR_SOURCE_SHA || inputs.source_sha }}
          DISPATCH_MODE: ${{ inputs.mode }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          args=()
          [[ -z "$RESUME_RUN_ID" || -n "$INPUT_SHA" ]] || { echo 'Recovery requires original source_sha' >&2; exit 1; }
          if [[ "$DISPATCH_MODE" == release ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]] || { echo 'Publication requires a dispatch on main' >&2; exit 1; }
            if [[ -z "$RESUME_RUN_ID" ]]; then args+=(--publish); fi
          fi
          python3 -B tap/scripts/ci.py source --sha "$INPUT_SHA" "${args[@]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: sorcererxw/positionbar
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.GH_PAT }}
          path: source
          persist-credentials: false
      - name: Confirm clean source, toolchain and locked packages
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ -z "$(git -C source status --porcelain)" ]]
          python3 -B source/scripts/testflight.py toolchain
          echo "POSITIONBAR_SOURCE_PACKAGES=$RUNNER_TEMP/SourcePackages" >> "$GITHUB_ENV"
          xcodebuild -resolvePackageDependencies -project source/apps/macos/PositionBar.xcodeproj \
            -scheme PositionBar -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile > "$RUNNER_TEMP/package-resolution.log" 2>&1
      - name: Offline regressions and the unsigned direct-distribution archive
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 -B -m unittest discover -s source/scripts/tests -v > "$RUNNER_TEMP/python-tests.log" 2>&1
          python3 -B source/apps/macos/scripts/test-build-identity.py > "$RUNNER_TEMP/identity-tests.log" 2>&1
          python3 -B source/apps/macos/scripts/test-build-registry.py > "$RUNNER_TEMP/registry-tests.log" 2>&1
          python3 -B source/apps/macos/scripts/test-build-wrapper.py > "$RUNNER_TEMP/wrapper-tests.log" 2>&1
          swift test --package-path source/apps/macos --scratch-path "$RUNNER_TEMP/updater-tests" \
            --force-resolved-versions --filter 'PositionBarAppTests.UpdateConfigurationTests' \
            > "$RUNNER_TEMP/updater-tests.log" 2>&1
          python3 -B source/scripts/check test-report "$RUNNER_TEMP/updater-tests.log" > "$RUNNER_TEMP/updater-tests.json"
          python3 -B tap/scripts/ci.py tests --report "$RUNNER_TEMP/updater-tests.json"
          python3 -B source/scripts/unified_release.py verify --source "$SOURCE_SHA" \
            --work "$RUNNER_TEMP/unsigned-verification" > "$RUNNER_TEMP/unsigned-archives.log" 2>&1
          echo 'Offline checks and the unsigned archive passed. Signing, notarization and uploads have not run.' >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && github.ref == 'refs/heads/main'
    # All fresh and recovery publications share one writer, without blocking PR checks.
    concurrency:
      group: positionbar-direct-release
      cancel-in-progress: false
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      APP_STORE_API_KEY_ID: ${{ vars.APP_STORE_API_KEY_ID }}
      APP_STORE_API_ISSUER_ID: ${{ vars.APP_STORE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: tap
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: sorcererxw/positionbar
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.GH_PAT }}
          path: source
          persist-credentials: false
      - name: Check toolchain and current source before publishing
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          args=()
          if [[ -z "$RESUME_RUN_ID" ]]; then args+=(--publish); fi
          python3 -B tap/scripts/ci.py source --sha "$SOURCE_SHA" "${args[@]}" > /dev/null
          unset GH_TOKEN
          [[ "$(git -C tap rev-parse HEAD)" == "$GITHUB_SHA" ]]
          git -C tap switch -c main
          python3 -B source/scripts/testflight.py toolchain
          echo "POSITIONBAR_SOURCE_PACKAGES=$RUNNER_TEMP/SourcePackages" >> "$GITHUB_ENV"
          xcodebuild -resolvePackageDependencies -project source/apps/macos/PositionBar.xcodeproj \
            -scheme PositionBar -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile > "$RUNNER_TEMP/package-resolution.log" 2>&1
          tool="$(find "$RUNNER_TEMP/SourcePackages/artifacts" -type f -name generate_appcast -print -quit)"
          [[ -n "$tool" && -x "$tool" && -x "$(dirname "$tool")/sign_update" ]]
          echo "SPARKLE_BIN=$(dirname "$tool")" >> "$GITHUB_ENV"
          git -C tap config user.name github-actions[bot]
          git -C tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Locate a trusted recovery checkpoint
        id: recovery
        if: inputs.resume_run_id != ''
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tap/scripts/ci.py recovery --run-id "$RESUME_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: inputs.resume_run_id != ''
        with:
          name: ${{ steps.recovery.outputs.artifact }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-state
      - name: Reserve the direct-release identity or validate its recovery checkpoint
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          args=()
          if [[ -n "$RESUME_RUN_ID" ]]; then args+=(--resume); fi
          python3 -B source/scripts/unified_release.py prepare --source "$SOURCE_SHA" \
            --state "$RUNNER_TEMP/release-state" "${args[@]}"
      - name: Preserve identity before signing starts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-state
          path: ${{ runner.temp }}/release-state
          retention-days: 30
          if-no-files-found: warn
      - name: Sign and notarize exact Sparkle DMG, verify public assets, update cask
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_STORE_API_PRIVATE_KEY: ${{ secrets.APP_STORE_API_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          HOMEBREW_NO_ANALYTICS: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! python3 -B source/scripts/unified_release.py homebrew --source "$SOURCE_SHA" \
            --state "$RUNNER_TEMP/release-state" --tap "$GITHUB_WORKSPACE/tap" \
            > "$RUNNER_TEMP/homebrew.log" 2>&1; then
            grep '^Direct release failed:' "$RUNNER_TEMP/homebrew.log" | tail -1 || true
            exit 1
          fi
      - name: Preserve exact Homebrew recovery bytes and non-secret receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: homebrew-state
          path: |
            ${{ runner.temp }}/release-state/release
            ${{ runner.temp }}/release-state/homebrew/homebrew.json
            ${{ runner.temp }}/release-state/homebrew/PositionBar-*.dmg
            ${{ runner.temp }}/release-state/homebrew/PositionBar-*.txt
            ${{ runner.temp }}/release-state/homebrew/appcast.xml
          retention-days: 30
          if-no-files-found: warn
      - name: Report exact direct-distribution result
        run: |
          python3 - "$RUNNER_TEMP/release-state/homebrew/homebrew.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          receipt = json.load(open(sys.argv[1]))
          assert receipt['status'] == 'published'
          print(f"Published source {receipt['source']}, version {receipt['version']}, Build ID {receipt['build']}.")
          print(receipt['artifact']['url'])
          print(receipt['githubRelease']['appcast'])
          PY
